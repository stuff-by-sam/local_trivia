name: Bug report
description: Something went wrong during setup or a game
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Which screen?
      options: [Player (phone), Presenter (TV), Admin console, Server / terminal, More than one]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v22.11.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1 / Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Anything the server printed. Automatically formatted as code.
      render: shell
