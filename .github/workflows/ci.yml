name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` fails outright if package.json and package-lock.json disagree,
      # so this doubles as the lockfile-drift check.
      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every JS file
        run: npm run check

      # Boots real servers, joins real Socket.IO clients, plays a question, and
      # asserts the operator-authorization rules from a non-loopback address.
      - name: Test
        run: npm test

      - name: Smoke-boot the three screens
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/ >/dev/null
          curl -sf http://localhost:3000/present >/dev/null
          curl -sf http://localhost:3000/admin >/dev/null
          echo "player, presenter and admin screens all served"

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Advisories get published against dependencies with no change on our side,
    # so a finding here shouldn't mark the build broken. Dependabot opens the
    # PR that actually fixes it; this job exists to make the finding visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
